name: CI Pipeline

on:
  push:
    branches: [ main, dev, staging ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: zeeshanahmad12/myapp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Docker Hub login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Image build aur push karo
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}

      - name: Manifests mein image tag update karo
        run: |
          sed -i "s|newTag:.*|newTag: ${{ github.sha }}|g" manifests/overlays/dev/kustomization.yml
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add manifests/
          git commit -m "ci: image tag update ${{ github.sha }}"
          git push
