- name: ArgoCD namespace banao
  command: oc new-project argocd
  ignore_errors: yes

- name: ArgoCD install karo
  command: oc apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml --server-side --force-conflicts

- name: ArgoCD SCC anyuid fix karo
  command: oc adm policy add-scc-to-group anyuid system:serviceaccounts:argocd

- name: ArgoCD SCC privileged fix karo
  command: oc adm policy add-scc-to-group privileged system:serviceaccounts:argocd

- name: ArgoCD seccomp patch karo
  shell: |
    for deploy in argocd-redis argocd-dex-server argocd-repo-server argocd-server argocd-applicationset-controller argocd-notifications-controller; do
      oc patch deployment $deploy -n argocd --type=json -p='[{"op": "remove", "path": "/spec/template/metadata/annotations"}]' 2>/dev/null || true
      oc patch deployment $deploy -n argocd --type=json -p='[{"op": "remove", "path": "/spec/template/spec/securityContext"}]' 2>/dev/null || true
    done

- name: ArgoCD ready hone ka wait karo
  command: oc wait --for=condition=available deployment/argocd-server -n argocd --timeout=600s

- name: ArgoCD route expose karo
  command: oc expose service argocd-server -n argocd
  ignore_errors: yes
